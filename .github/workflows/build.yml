name: build
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  launch-contract-tests:
    name: launch contract tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./UxplayLauncher/UxplayLauncher.LaunchContract.Tests/UxplayLauncher.LaunchContract.Tests.csproj

      - name: Test
        run: >-
          dotnet test ./UxplayLauncher/UxplayLauncher.LaunchContract.Tests/UxplayLauncher.LaunchContract.Tests.csproj
          -c Release --no-restore --verbosity minimal -p:TreatWarningsAsErrors=true